name: Android Build & APK Export

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Export APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Restore and validate Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          # Restore optional debug.keystore if supplied via secret so debug SHA-1 matches Firebase Auth
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ] && [ ! -f "debug.keystore" ]; then
            python3 - <<'PY'
          import base64, os, re
          raw = re.sub(r"\s+", "", os.environ["DEBUG_KEYSTORE_BASE64"])
          with open("debug.keystore", "wb") as f:
              f.write(base64.b64decode(raw, validate=True))
          print("Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret.")
          PY
          fi

          # Restore app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 securely without printing secrets
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            if [ -f "app/google-services.json" ]; then
              echo "Using existing app/google-services.json present in workspace."
            else
              echo "::error title=Missing GOOGLE_SERVICES_JSON_BASE64 Secret::Firebase configuration file 'app/google-services.json' is missing in the GitHub Actions environment. Add repository secret 'GOOGLE_SERVICES_JSON_BASE64' (Settings -> Secrets and variables -> Actions) with the Base64-encoded contents of your Firebase 'google-services.json' for package 'com.usman.musicplayer'."
              exit 1
            fi
          else
            mkdir -p app
            python3 - <<'PY'
          import base64, os, re, sys
          raw = re.sub(r"\s+", "", os.environ["GOOGLE_SERVICES_JSON_BASE64"])
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              print(f"::error title=Invalid GOOGLE_SERVICES_JSON_BASE64::Failed to Base64-decode GOOGLE_SERVICES_JSON_BASE64: {exc}")
              sys.exit(1)
          with open("app/google-services.json", "wb") as f:
              f.write(decoded)
          print("Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret.")
          PY
          fi

          # Verify that app/google-services.json exists and is valid JSON matching com.usman.musicplayer
          python3 - <<'PY'
          import json, os, sys

          path = "app/google-services.json"
          expected_pkg = "com.usman.musicplayer"

          if not os.path.exists(path):
              print(f"::error file={path}::File {path} does not exist.")
              sys.exit(1)

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"::error file={path}::Invalid JSON in {path}: {exc}")
              sys.exit(1)

          clients = data.get("client", [])
          matching_client = None
          for client in clients:
              pkg = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
              if pkg == expected_pkg:
                  matching_client = client
                  break

          if matching_client is None:
              print(
                  f"::error file={path}::No Android client in {path} matches application package '{expected_pkg}'."
              )
              sys.exit(1)

          oauth_clients = list(matching_client.get("oauth_client", []))
          other_oauth = (
              matching_client.get("services", {})
              .get("appinvite_service", {})
              .get("other_platform_oauth_client", [])
          )
          web_clients = [
              c for c in (oauth_clients + list(other_oauth))
              if c.get("client_type") == 3 and c.get("client_id")
          ]

          if not web_clients:
              print(
                  f"::error file={path}::No Google OAuth Web Client ID (client_type: 3) found in {path} for '{expected_pkg}'. "
                  "Enable Google Sign-In in Firebase Console -> Authentication -> Sign-in method -> Google and update GOOGLE_SERVICES_JSON_BASE64."
              )
              sys.exit(1)

          print(
              f"Validated {path}: valid JSON, package='{expected_pkg}', "
              f"client_type=3 entries={len(web_clients)}."
          )
          PY

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Process Google Services resources
        run: |
          set -euo pipefail
          ./gradlew :app:processDebugGoogleServices
          GENERATED_XML="app/build/generated/res/processDebugGoogleServices/values/values.xml"
          if [ ! -f "$GENERATED_XML" ] || ! grep -q 'name="default_web_client_id"' "$GENERATED_XML"; then
            echo "::error::Generated Firebase resources missing 'default_web_client_id' in $GENERATED_XML"
            exit 1
          fi
          echo "Verified generated Firebase resource 'default_web_client_id' in $GENERATED_XML."

      - name: Compile Debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Package Debug APK, Checksum & Build Info
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected debug APK is missing or empty at $APK_PATH"
            exit 1
          fi

          EXPORT_DIR="build/export-debug-apk"
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          cp "$APK_PATH" "$EXPORT_DIR/app-debug.apk"
          (
            cd "$EXPORT_DIR"
            sha256sum app-debug.apk > SHA256SUMS.txt
          )

          APK_SIZE_BYTES=$(stat -c%s "$EXPORT_DIR/app-debug.apk")
          APK_SIZE_HUMAN=$(ls -lh "$EXPORT_DIR/app-debug.apk" | awk '{print $5}')
          APK_SHA256=$(awk '{print $1}' "$EXPORT_DIR/SHA256SUMS.txt")
          RELEASE_STATUS="Pending (configure RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets for signed release APK)"
          if [ "${HAS_RELEASE_SIGNING:-false}" = "true" ]; then
            RELEASE_STATUS="Configured (signing secrets present)"
          fi

          cat > "$EXPORT_DIR/BUILD-INFO.txt" <<EOF
          Application: USMAN MUSIC
          Package / Application ID: com.usman.musicplayer
          Build Variant: debug
          APK File: app-debug.apk
          APK Size: ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)
          APK SHA-256: ${APK_SHA256}
          Firebase Resource (default_web_client_id): Generated and verified
          Release Signing Status: ${RELEASE_STATUS}
          GitHub Repository: ${GITHUB_REPOSITORY}
          Git Ref: ${GITHUB_REF_NAME}
          Commit SHA: ${GITHUB_SHA}
          Workflow Run ID: ${GITHUB_RUN_ID} (Attempt ${GITHUB_RUN_ATTEMPT})
          Build Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          echo "Packaged export directory:"
          ls -lh "$EXPORT_DIR"
          cat "$EXPORT_DIR/SHA256SUMS.txt"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: USMAN-MUSIC-PLAYER-debug-APK
          path: |
            build/export-debug-apk/app-debug.apk
            build/export-debug-apk/SHA256SUMS.txt
            build/export-debug-apk/BUILD-INFO.txt
          retention-days: 14
          if-no-files-found: error

      - name: Build Signed Release APK (when signing secrets are configured)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_TMP="${RUNNER_TEMP}/upload-keystore.jks"
          trap 'rm -f "$KEYSTORE_TMP"' EXIT

          python3 - <<'PY'
          import base64, os, re
          raw = re.sub(r"\s+", "", os.environ["RELEASE_KEYSTORE_BASE64"])
          with open(os.path.join(os.environ["RUNNER_TEMP"], "upload-keystore.jks"), "wb") as f:
              f.write(base64.b64decode(raw, validate=True))
          PY

          KEYSTORE_PATH="$KEYSTORE_TMP" ./gradlew :app:assembleRelease
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Expected release APK is missing or empty at $RELEASE_APK"
            exit 1
          fi
          mkdir -p build/export-release-apk
          cp "$RELEASE_APK" build/export-release-apk/app-release.apk
          (
            cd build/export-release-apk
            sha256sum app-release.apk > SHA256SUMS.txt
          )

      - name: Upload Signed Release APK Artifact (when built)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: USMAN-MUSIC-PLAYER-release-APK
          path: |
            build/export-release-apk/app-release.apk
            build/export-release-apk/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Clean up sensitive restored files
        if: always()
        run: |
          rm -f app/google-services.json debug.keystore "${RUNNER_TEMP}/upload-keystore.jks"
